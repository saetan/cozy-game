<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>House Kit — pieces, builder, level path</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #f4f0ea; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #3a3632; }
  a { color: #b86f63; } a:hover { color: #8f4f45; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  .panel { position: fixed; top: 16px; width: 260px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;
        background: rgba(255,253,250,0.92); border: 1px solid rgba(58,54,50,0.12); border-radius: 10px; padding: 16px; z-index: 5; }
  #ui { left: 16px; } #actions { right: 16px; width: 248px; }
  .panel h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  .panel .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .panel .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .panel button, .panel select { font: inherit; font-size: 12px; padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(58,54,50,0.2); background: #fff; color: inherit; cursor: pointer; text-align: left; }
  .panel button:hover { border-color: rgba(58,54,50,0.45); }
  .panel button[aria-pressed="true"] { background: #3a3632; color: #fdfbf8; border-color: #3a3632; }
  .panel select { width: 100%; }
  .panel .spec { font: 11px/1.6 ui-monospace, Menlo, monospace; color: #6b655e; margin: 0; word-break: break-word; }
  .panel .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a837b; }
  .panel button:disabled { opacity: 0.45; cursor: default; }
  .panel .group { display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<three-d-stage name="house-kit" background="#f4f0ea"></three-d-stage>
<div id="ui" class="panel">
  <h1>House Kit</h1>
  <div class="row">
    <button data-view="kit" aria-pressed="true">Pieces</button>
    <button data-view="house">Random house</button>
    <button id="regen">Regenerate</button>
    <button data-view="growth">Growth</button>
  </div>
  <div class="group">
    <div class="label">House level · fixed growth path</div>
    <div class="row" id="levelList"></div>
    <p class="spec" id="levelNote"></p>
    <button id="driveBtn" disabled>Drive into garage</button>
  </div>
  <div>
    <div class="label" style="margin-bottom:6px">Single piece</div>
    <select id="piece"><option value="">— choose to isolate —</option></select>
  </div>
  <p class="spec" id="spec"></p>
</div>
<script src="three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';
import * as Kit from '../kit/kit.js';
const { CELL, WALL_H, T, FOUND_H, RISE, M, P, PAINT, CLOTH, box, grp, ease, LEVELS, buildPlan, house, resident, setAction, board, parkBike, animate, getActors, clearActors } = Kit;
const stage = document.querySelector('three-d-stage');
await stage.ready;
document.getElementById('spec').innerHTML =
  `cell ${CELL} m · wall ${WALL_H} m · thick ${T} m<br>foundation ${FOUND_H} m · roof pitch ${RISE / CELL} (rise/run)<br>walls: pivot = bottom-centre of outer face,<br>outside = +z, body extends to −z`;

const LABELS = {
  foundation: 'Foundation tile', wall: 'Wall', wallWindow: 'Wall + window', wallDoor: 'Wall + door',
  cornerPost: 'Corner post', beltCourse: 'Belt course (floor trim)', roofSlope: 'Roof slope', ridgeCap: 'Ridge cap',
  gableHalf: 'Gable segment', porchDeck: 'Porch deck', porchPost: 'Porch post', porchSteps: 'Porch steps', chimney: 'Chimney', fence: 'Fence', shrub: 'Shrub',
  driveway: 'Garage · Driveway tile', garageSlab: 'Garage · Floor slab', wallGarage: 'Garage · Door wall', bikeStand: 'Yard · Bike stand',
};
const sel = document.getElementById('piece');
for (const k in LABELS) sel.add(new Option(LABELS[k], k));

function kit() {
  const g = grp('house_kit_pieces');
  const rows = [['wall', 'wallWindow', 'wallDoor', 'cornerPost', 'wallGarage'],
                ['foundation', 'gableHalf', 'beltCourse', 'fence', 'garageSlab'],
                ['roofSlope', 'ridgeCap', 'chimney', 'shrub', 'driveway'],
                ['porchDeck', 'porchPost', 'porchSteps', 'bikeStand']];
  rows.forEach((row, r) => row.forEach((k, i) => {
    const p = P[k](); p.position.set((i - 2) * 2.8, 0, (1.5 - r) * 3.4); g.add(p);
    if (k === 'bikeStand') parkBike(p, P.bicycle({ paint: PAINT.peach }), 0);
  }));
  return g;
}

const LOT = { x0: -1, x1: 4, z0: -2, z1: 5, ox: -3, oz: -3 }, lwx = x => x * CELL + LOT.ox, lwz = z => z * CELL + LOT.oz;
const LEVEL_RES = [['bunny', 'pink', 'mint', 'wave', 0.5, 3.7], ['bear', 'blue', 'yellow', 'stand', 1.4, 3.6], ['fox', 'mint', 'yellow', 'wave', 0.95, 4.4]];
const DRIVE = { x: lwx(-0.5), outZ: lwz(3.6), inZ: lwz(1.0) };
let drive = { state: 'out', anim: null };
function levelPlan(lv) {
  const plan = buildPlan(LEVELS[lv], LOT.ox, LOT.oz);
  LEVEL_RES.slice(0, [1, 1, 2, 2, 2, 3, 3][lv]).forEach(([sp, o, s, a, x, z], i) =>
    plan.push({ key: 'res:' + i, make: () => setAction(resident(sp, { outfit: CLOTH[o], scarf: CLOTH[s] }), a), x: lwx(x), y: 0, z: lwz(z), ry: 0 }));
  // bike parked in the stand (slot 0 of the stand cell)
  const sb = LEVELS[lv].bikeStand;
  if (sb) plan.push({ key: 'bike', make: () => P.bicycle({ paint: PAINT.mint }), x: lwx(sb[0] + 0.5) - 0.42, y: 0, z: lwz(sb[1] + 0.5) - 0.13, ry: Math.PI });
  plan.push({ key: 'car', make: () => board(P.car({ paint: PAINT.sky }), resident('cat', { outfit: CLOTH.lilac, scarf: CLOTH.pink })),
    x: DRIVE.x, y: 0, z: drive.state === 'in' ? DRIVE.inZ : DRIVE.outZ, ry: Math.PI });
  return plan;
}
function garageDoor() { for (const [k, o] of growth.pieces) if (k.endsWith(':garage')) return o.getObjectByName('garage_door'); }
function startDrive() {
  if (!growth || drive.anim || !LEVELS[level].garage) return;
  drive.anim = { t0: performance.now() / 1000, dir: drive.state === 'in' ? 'out' : 'in' };
  refreshLevelUI();
}
function stepDrive() {
  if (!drive.anim || !growth) return;
  const car = growth.pieces.get('car'), door = garageDoor(), e = performance.now() / 1000 - drive.anim.t0;
  if (!car || !door) { drive.anim = null; return; }
  const open = e < 0.8 ? e / 0.8 : e < 3.4 ? 1 : Math.max(0, 1 - (e - 3.4) / 0.8);
  door.rotation.x = Math.PI / 2 * 0.97 * ease(open);
  const m = ease(Math.min(1, Math.max(0, (e - 0.7) / 2.5))), [a, b] = drive.anim.dir === 'in' ? [DRIVE.outZ, DRIVE.inZ] : [DRIVE.inZ, DRIVE.outZ];
  const z = a + (b - a) * m, dz = z - car.position.z;
  car.position.z = z;
  car.traverse(o => { if (o.name === 'wheel') o.rotation.x += dz / 0.28; });
  if (e >= 4.2) { drive.state = drive.anim.dir; drive.anim = null; door.rotation.x = 0; refreshLevelUI(); }
}
const grassM = M('grass', '#d3e8c2', 0.95), gridM = M('grid_line', '#eaf4e0', 0.9);
const ghostM = new THREE.MeshStandardMaterial({ color: '#fbf7f0', transparent: true, opacity: 0.6, roughness: 1 }); ghostM.name = 'next_level_ghost';
function buildLot() {
  const { x0, x1, z0, z1 } = LOT, g = grp('building_lot'), cxm = lwx((x0 + x1) / 2), czm = lwz((z0 + z1) / 2);
  g.add(box('lot_grass', (x1 - x0) * CELL, 0.06, (z1 - z0) * CELL, grassM, cxm, -0.03, czm));
  for (let x = x0; x <= x1; x++) g.add(box('grid_line', 0.04, 0.006, (z1 - z0) * CELL, gridM, lwx(x), 0.003, czm));
  for (let z = z0; z <= z1; z++) g.add(box('grid_line', (x1 - x0) * CELL, 0.006, 0.04, gridM, cxm, 0.003, lwz(z)));
  g.add(grp('next_level_preview'));
  return g;
}
function updateGhost(root, lv) {
  const ghost = root.getObjectByName('next_level_preview');
  ghost.clear();
  const next = LEVELS[lv + 1]; if (!next) return;
  const cur = new Set([...LEVELS[lv].cells.filter(c => !c[2]).map(c => c[0] + ',' + c[1]), ...LEVELS[lv].porch.map(p => p.join(','))]);
  for (const [x, z] of [...next.cells.filter(c => !c[2]), ...next.porch]) if (!cur.has(x + ',' + z))
    ghost.add(box('next_cell', CELL - 0.14, 0.02, CELL - 0.14, ghostM, lwx(x + 0.5), 0.012, lwz(z + 0.5)));
}

// pop-in / shrink-out tweens for level-ups
const tweens = [];
const backOut = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function tween(obj, from, to, dur, delay, done) { tweens.push({ obj, from, to, dur, t0: performance.now() / 1000 + delay, done }); obj.scale.setScalar(Math.max(from, 0.001)); }
function stepTweens() {
  const now = performance.now() / 1000;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i], k = Math.min(1, Math.max(0, (now - w.t0) / w.dur));
    w.obj.scale.setScalar(Math.max(0.001, w.from + (w.to - w.from) * (w.to > w.from ? backOut(k) : ease(k))));
    if (k >= 1) { tweens.splice(i, 1); w.done && w.done(); }
  }
}
let growth = null;
function applyLevel(lv, animateIt) {
  const plan = levelPlan(lv), next = new Set(plan.map(p => p.key));
  for (const [k, o] of growth.pieces) if (!next.has(k)) {
    growth.pieces.delete(k);
    const gone = () => { o.removeFromParent(); const A = getActors(), k = A.indexOf(o); if (k >= 0) A.splice(k, 1); };
    animateIt ? tween(o, 1, 0, 0.3, 0, gone) : gone();
  }
  const fresh = plan.filter(p => !growth.pieces.has(p.key)).sort((a, b) => a.y - b.y || a.z - b.z);
  const step = Math.min(0.04, 1.6 / Math.max(1, fresh.length));
  fresh.forEach((p, i) => {
    const o = p.make();
    o.position.set(p.x, p.y, p.z); o.rotation.y = p.ry;
    o.traverse(m => { if (m.isMesh) m.castShadow = m.receiveShadow = true; });
    growth.root.add(o); growth.pieces.set(p.key, o);
    if (animateIt) tween(o, 0, 1, 0.45, 0.25 + i * step);
  });
  updateGhost(growth.root, lv);
  if (!LEVELS[lv].garage && (drive.state === 'in' || drive.anim)) {
    const car = growth.pieces.get('car'); drive = { state: 'out', anim: null };
    if (car) car.position.z = DRIVE.outZ;
  }
}
function growthRoot(lv) {
  growth = { root: grp('house_growth'), pieces: new Map() };
  drive = { state: 'out', anim: null };
  growth.root.add(buildLot());
  applyLevel(lv, false);
  return growth.root;
}


let seed = 7, view = 'kit';
const btns = document.querySelectorAll('[data-view]');
const mkBtn = (label, onclick, data) => { const b = document.createElement('button'); b.textContent = label; b.onclick = onclick; Object.assign(b.dataset, data); return b; };
let level = 0;
const lvList = document.getElementById('levelList'), lvNote = document.getElementById('levelNote');
LEVELS.forEach((L, i) => lvList.append(mkBtn(String(i + 1), () => goLevel(i), { level: String(i) })));
lvList.append(mkBtn('Level up ▸', () => goLevel(Math.min(level + 1, LEVELS.length - 1)), {}));
function refreshLevelUI() {
  lvList.querySelectorAll('[data-level]').forEach(b => b.setAttribute('aria-pressed', String(view === 'growth' && b.dataset.level === String(level))));
  const L = LEVELS[level], N = LEVELS[level + 1];
  lvNote.textContent = `Lv ${level + 1} · ${L.name} — ${L.note}.` + (N ? ` Next: ${N.name} (ghost tiles).` : ' Max level.');
  const db = document.getElementById('driveBtn');
  db.disabled = !(view === 'growth' && L.garage) || !!drive.anim;
  db.textContent = drive.anim ? (drive.anim.dir === 'in' ? 'Driving in…' : 'Driving out…') : drive.state === 'in' ? 'Drive out of garage' : 'Drive into garage';
}
document.getElementById('driveBtn').onclick = startDrive;
function goLevel(i) {
  if (view !== 'growth') { level = i; show('growth'); return; }
  if (i === level) return;
  level = i; applyLevel(level, true); refreshLevelUI();
}
function show(v) {
  view = v; clearActors(); tweens.length = 0;
  btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  if (v !== 'piece') sel.value = '';
  refreshLevelUI();
  stage.setObject(v === 'kit' ? kit() : v === 'house' ? house(seed) : v === 'growth' ? growthRoot(level) : P[sel.value]());
}
const clock = new THREE.Clock();
(function tick() { const t = clock.getElapsedTime(); for (const a of getActors()) animate(a, t + a.userData.phase); stepTweens(); stepDrive(); requestAnimationFrame(tick); })();
btns.forEach(b => b.onclick = () => show(b.dataset.view));
document.getElementById('regen').onclick = () => { seed = Math.floor(Math.random() * 1e6); show('house'); };
sel.onchange = () => sel.value ? show('piece') : show('kit');
window.__kit = { show, goLevel, Kit };
show('kit');
</script>
</body>
</html>
