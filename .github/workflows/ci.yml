name: CI
# PRs always run typecheck + unit tests. The e2e suite runs on pushes to main, on demand
# (Actions tab -> CI -> Run workflow), and on PRs that change what the e2e suite exercises directly
# (see the path list in the `changes` job).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# A new push to a PR cancels that PR's older run; runs on main and on demand are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  # Decides whether e2e runs. Not a workflow-level paths filter: that would skip `test` too.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        # On a pull request the checkout is the merge commit, so its first parent is the base: HEAD^1..HEAD is exactly
        # the PR's change. --no-renames lists a moved file under its old path too; quotepath=off keeps non-ASCII
        # names unquoted. The list is captured first so a failing `git diff` fails the job instead of reading as "no match".
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "e2e=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git -c core.quotepath=off diff --no-renames --name-only HEAD^1 HEAD)"
          if printf '%s\n' "$files" | grep -E '^(e2e/|playwright\.config\.ts$|src/ui/|src/render/|src/kit/|design/kit/|src/main\.ts$|src/game\.ts$|src/style\.css$|index\.html$|vite\.config\.|package(-lock)?\.json$|\.github/workflows/)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi
  # Software WebGL makes each e2e test slow, so the suite is split across parallel runners (one worker each).
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
  # One HTML report for the whole suite, merged from the shards.
  e2e-report:
    if: always() && needs.changes.outputs.e2e == 'true'
    needs: [changes, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
