<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cozy Game</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="stats"><span id="coins-chip"><span class="coin-icon" aria-hidden="true"></span>Coins <b id="coins">0</b></span><span id="day">Day 1</span><span id="clock">06:00</span></div>
    <div id="speed">
      <button class="speed-btn" data-speed="1">1&times;</button>
      <button class="speed-btn" data-speed="5">5&times;</button>
      <button class="speed-btn" data-speed="20">20&times;</button>
    </div>
    <div id="build-menu">
      <button class="build-btn wide" data-type="house"><span class="label">Build House</span> <span class="cost"></span></button>
      <button class="build-btn wide" data-type="farmPlot"><span class="label">Build Farm plot</span> <span class="cost"></span></button>
      <button class="build-btn wide" data-type="shrub"><span class="label">Shrub</span> <span class="cost"></span></button>
      <button class="build-btn wide" data-type="fence"><span class="label">Fence</span> <span class="cost"></span></button>
      <button class="build-btn wide" data-type="scarecrow"><span class="label">Scarecrow</span> <span class="cost"></span></button>
      <button class="tile-btn wide" data-tool="path"><span class="label">Path</span> <span class="cost"></span></button>
      <button class="tile-btn wide" data-tool="road"><span class="label">Road</span> <span class="cost"></span></button>
      <button class="tile-btn wide" data-tool="erase"><span class="label">Erase tile</span></button>
      <button id="residents-btn" class="wide" aria-expanded="false">Residents</button>
      <button id="export-btn" class="wide">Export</button>
      <button id="import-btn" class="wide">Import</button>
      <button id="new-btn" class="wide">New village</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden />
    </div>
    <div id="tile-bar" hidden>
      <span id="tile-status"></span>
      <button id="tile-done" class="wide primary" title="Done (Esc)">Done (Esc)</button>
    </div>
    <div id="place-bar" hidden>
      <span id="place-status"></span>
      <button id="rotate" class="wide" title="Rotate (R)">Rotate (R)</button>
      <button id="confirm" class="wide primary">Place</button>
      <button id="cancel" class="wide" title="Cancel (Esc)">Cancel (Esc)</button>
    </div>
  </div>
  <div id="panel" class="ui-panel" hidden></div>
  <div id="residents-panel" class="ui-panel" hidden></div>
  <div id="arrival-card" class="ui-panel" role="dialog" aria-live="polite" hidden></div>
  <div id="away-card" class="ui-panel" role="dialog" hidden></div>
  <div id="toast" class="ui-panel" role="status" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
