<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cozy Game</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <button id="build" class="wide">Build House</button>
    <div id="place-bar" hidden>
      <span id="place-status"></span>
      <button id="rotate" class="wide" title="Rotate (R)">Rotate (R)</button>
      <button id="confirm" class="wide primary">Place</button>
      <button id="cancel" class="wide" title="Cancel (Esc)">Cancel (Esc)</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
