<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cozy Game</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="stats"><span title="Coins">&#9679; <b id="coins">0</b></span><span id="day">Day 1</span><span id="clock">06:00</span></div>
    <div id="speed">
      <button class="speed-btn" data-speed="1">1&times;</button>
      <button class="speed-btn" data-speed="5">5&times;</button>
      <button class="speed-btn" data-speed="20">20&times;</button>
    </div>
    <div id="build-menu">
      <button class="build-btn wide" data-type="house">Build House</button>
      <button class="build-btn wide" data-type="farmPlot">Build Farm plot</button>
    </div>
    <div id="place-bar" hidden>
      <span id="place-status"></span>
      <button id="rotate" class="wide" title="Rotate (R)">Rotate (R)</button>
      <button id="confirm" class="wide primary">Place</button>
      <button id="cancel" class="wide" title="Cancel (Esc)">Cancel (Esc)</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
